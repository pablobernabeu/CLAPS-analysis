# config/arc_modules.yaml
# The ARC software environment for the CLAPS workflow.
#
# Every value below was verified on ARC on 2026-07-30 by loading the module and
# reading the version back, not inferred. An earlier version of this file recorded
# the R module as "UNRESOLVED" and guessed at plausible names; the pin is now known.
#
# This file is the RECORD of intent. The observed state of the resulting
# environment, package by package, is config/arc_environment_recorded.csv. Read
# docs/reproducibility.md for how the two relate and how to rebuild from scratch.
#
# To re-verify after a cluster upgrade:
#   ssh <arc-host> 'module -t avail R; module load R/4.4.2-gfbf-2024a; R --version'
#   Rscript scripts/check_environment.R --compare config/arc_environment_recorded.csv

r:
  # VERIFIED loadable on 2026-07-30; reports "R version 4.4.2 (2024-10-31)".
  # This exact string is the default in 18 of the 19 hpc/ scripts, via
  # "${ARC_R_MODULE:-R/4.4.2-gfbf-2024a}", so overriding ARC_R_MODULE changes the R
  # used by a job. Do not set it casually: renv.lock records 4.4.2, and the reported
  # results were produced under it.
  module: "R/4.4.2-gfbf-2024a"
  version: "4.4.2"
  min_version: "4.4.0"          # base R gained %||%, which the scripts rely on, in 4.4
  notes: >
    Other versions present on the cluster as of 2026-07-30: 4.1.2, 4.2.1, 4.2.2,
    4.3.2, 4.4.1, 4.4.2, 4.5.1. Moving to 4.5.1 would require regenerating
    renv.lock and re-recording config/arc_environment_recorded.csv, because the
    project library is built per R minor version.
    All 21 scripts in hpc/ now resolve to this module. hpc/submit_devel_smoke_test.sh
    defaulted to a bare "R" until 2026-07-30, meaning the smoke test validated a
    different R from the one the production arrays use.

cmdstan:
  # NOT a module on ARC. Installed into project storage and discovered at run time
  # by each SLURM script, which globs $DATA/PROJECT_GROUP/cmdstan/cmdstan-* and takes
  # the highest version.
  module: null
  installed_version: "cmdstan-2.39.0"
  path: "$DATA/PROJECT_GROUP/cmdstan/cmdstan-2.39.0"
  notes: >
    Verified present on 2026-07-30; it is the only version installed, so the
    glob-and-sort discovery in the hpc/ scripts resolves to it deterministically.
    Reinstall on an interactive node with:
      Rscript -e "cmdstanr::install_cmdstan(cores = 4)"
    cmdstanr 0.8.0 is the locked interface to it.

quarto:
  # Not a module. A standalone build lives in project storage and is put on PATH by
  # hpc/submit_render_reports.sh. Its bundled deno traps on the hardened login node,
  # so rendering only works inside a job; see docs/arc_submission_guide.md.
  module: null
  path: "$DATA/PROJECT_GROUP/quarto-1.9.38"
  notes: >
    Renders on compute nodes only, never from a bare login-node `quarto render`.

gcc:
  # Comes in as a dependency of the R module rather than being loaded separately.
  module: null
  observed_version: "13.3.0"
  notes: >
    Reported by `gcc --version` after loading R/4.4.2-gfbf-2024a. Required for
    CmdStan to compile Stan models.

os:
  # Recorded because Stan compiles C++ against the system toolchain, so the OS is
  # part of what determines whether a fit reproduces bit for bit.
  observed: "AlmaLinux 9.8 (Olive Jaguar)"
  kernel: "5.14.0-687.29.1.el9_8.x86_64"

containers:
  # Checked on 2026-07-30: apptainer, singularity, podman and docker are absent from
  # PATH and from the module tree on the login node. Containerising the analysis is
  # therefore not an option on this cluster at present, which is why reproducibility
  # rests on the module pin plus renv.lock plus the recorded package set instead.
  available: false
  checked: "2026-07-30"

# Default module purge and load sequence for SLURM scripts
load_sequence:
  - "module purge"
  - "module load ${ARC_R_MODULE:-R}"
  - "# optional: module load cmdstan"
  - "# optional: module load quarto"

# Environment variables set in every SLURM script
env_vars:
  OMP_NUM_THREADS:    "${SLURM_CPUS_PER_TASK:-1}"
  STAN_NUM_THREADS:   "${SLURM_CPUS_PER_TASK:-1}"
  CMDSTANR_OUTPUT_DIR: "${TMPDIR:-outputs/cmdstan_tmp}"
